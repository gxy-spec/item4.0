schema_version: "1.0"
experiment_id: CI_E1_UGV_RGBD_SAFETY_CLEAR_S1001
experiment_type: dynamic_sensor_acceptance
random_seed: 1001
includes:
  - ../base/simulator.yaml
  - ../regions/town10hd_zone_a.yaml
  - ../tasks/red_van_approach.yaml
  - ../actors/single_uav_single_ugv.yaml
  - ../sensors/rgb_depth_v1.yaml
  - ../communication/fixed_semantic_v1.yaml
simulation:
  duration_seconds: 10.0
sensors:
  width: 800
  height: 600
  fov_degrees: 100.0
actors:
  distractors:
    same_category_wrong_color: 0
    same_color_wrong_category: 0
    random_vehicles: 0
    pedestrians: 0
dynamic:
  mode: ugv_rgbd_safety_clear_path_smoke
  ugv_target_speed_mps: 2.0
  ugv_start_delay_seconds: 0.0
  ugv_safety:
    enabled: true
    obstacle_source: ugv_rgbd
    target_stop_distance_m: 1.0
    maximum_range_m: 18.0
    sensor_corridor_half_width_m: 1.6
    minimum_obstacle_height_m: 0.12
    maximum_obstacle_height_m: 2.6
    warning_distance_m: 8.0
    sensor_stop_distance_m: 4.0
    warning_ttc_s: 3.0
    stop_ttc_s: 1.5
    stale_after_s: 0.30
    pixel_stride: 4
    minimum_occupied_points: 3
    recovery_clear_frames: 5
  uav_speed_mps: 5.0
  uav_altitude_m: 60.0
  uav_ignore_collision: false
  uav_camera_yaw_mode: world_fixed
  uav_camera_yaw_degrees: 0.0
  render_settle_seconds: 0.085
  target_static: true
  background_vehicle_autopilot: false
  pedestrian_motion: false
  save_all_samples: false
  sensor_save_every_n_frames: 10
acceptance:
  minimum_common_frame_ratio: 0.0
  minimum_ugv_rgbd_pair_ratio: 0.95
  minimum_ugv_path_m: 8.0
  minimum_uav_path_m: 40.0
  maximum_ugv_collisions: 0
  maximum_uav_collisions: 0
  maximum_target_drift_m: 0.20
  maximum_uav_tracking_p95_m: 1.0
  minimum_moving_vehicles: 0
  vehicle_motion_threshold_m: 5.0
  minimum_moving_pedestrians: 0
  pedestrian_motion_threshold_m: 2.0
  minimum_unique_rgb_fraction: 0.80
  minimum_ugv_unique_rgb_fraction: 0.40
  maximum_sensor_stop_ticks: 0
output:
  root: E:/CarlaAirData/CityInspection_GOC/e4_ugv_sensor_safety/smoke/clear_path
  save_rgb: true
  save_depth_raw: false
  save_depth_float_m: false
  save_depth_colour: true
  save_ground_truth: true
  save_trajectory: true
  save_resolved_config: true
